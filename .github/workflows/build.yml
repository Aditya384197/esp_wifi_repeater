name: Build ESP8266 Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-esp8266:
    name: Build ESP8266 firmware
    runs-on: ubuntu-latest
    container: martinfger/iot_devel:1.0

    steps:
      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd /home/esp
          rm -rf esp_wifi_repeater
          git clone --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" esp_wifi_repeater
          cd esp_wifi_repeater
          make
          test -d firmware
          find firmware -maxdepth 2 -type f -print

      - name: Package ESP8266 firmware
        shell: bash
        run: |
          set -euo pipefail
          cd /home/esp/esp_wifi_repeater
          rm -rf /tmp/esp8266-firmware
          mkdir -p /tmp/esp8266-firmware
          find firmware -maxdepth 2 -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
            -exec cp --parents {} /tmp/esp8266-firmware/ \;
          test -n "$(find /tmp/esp8266-firmware -type f -print -quit)"
          tar -C /tmp/esp8266-firmware -czf /home/esp/esp8266-firmware.tar.gz .

      - name: Upload ESP8266 firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware
          path: /home/esp/esp8266-firmware.tar.gz
          if-no-files-found: error
          retention-days: 30
