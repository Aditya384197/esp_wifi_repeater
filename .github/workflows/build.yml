name: Build ESP8266 Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-esp8266:
    name: Build and update ESP8266 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware inside ESP8266 build container
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            martinfger/iot_devel:1.0 \
            bash -lc 'make'

      - name: Update main firmware BIN in repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p firmware

          # Find the firmware BIN produced by the build, while ignoring
          # the repository's existing firmware/ copy.
          mapfile -t BUILT_BINS < <(
            find . -type f -name '*.bin' \
              ! -path './firmware/*' \
              ! -path './.git/*' \
              -print
          )

          if [ "${#BUILT_BINS[@]}" -eq 0 ]; then
            echo "ERROR: No newly built .bin firmware was found."
            exit 1
          fi

          if [ "${#BUILT_BINS[@]}" -gt 1 ]; then
            echo "ERROR: More than one newly built .bin was found:"
            printf '  %s\n' "${BUILT_BINS[@]}"
            echo "Refusing to guess which firmware is the main ESP8266 firmware."
            exit 1
          fi

          BUILT_BIN="${BUILT_BINS[0]}"

          # Use the existing main BIN name when exactly one BIN already
          # exists in the repository's firmware/ directory.
          mapfile -t MAIN_BINS < <(
            find firmware -maxdepth 1 -type f -name '*.bin' -print
          )

          if [ "${#MAIN_BINS[@]}" -eq 1 ]; then
            TARGET_BIN="${MAIN_BINS[0]}"
          else
            TARGET_BIN="firmware/esp_wifi_repeater.bin"
          fi

          echo "Built firmware : $BUILT_BIN"
          echo "Repository BIN : $TARGET_BIN"

          cp -f "$BUILT_BIN" "$TARGET_BIN"
          ls -lh "$TARGET_BIN"

      - name: Commit updated firmware BIN
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firmware/*.bin

          if git diff --cached --quiet; then
            echo "No firmware change to commit."
            exit 0
          fi

          git commit -m "Update ESP8266 firmware build"
          git push
